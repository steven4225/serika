name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22.13.0, 26.4.0]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  runtime-minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # pnpm 11 requires >=22.13; build with the supported toolchain, then
      # exercise the actual declared runtime floor without pnpm in the path.
      - uses: actions/setup-node@v7
        with:
          node-version: 26.4.0
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:runtime
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      # Keep the originally failing standalone command explicit: do not rely
      # on unrelated test files to keep deadline timers alive.
      - run: node --test packages/ai-sdk-adapter/dist/loop.test.js
      - run: node --test --test-concurrency=4 packages/core/dist/*.test.js packages/ai-sdk-adapter/dist/*.test.js examples/cli/dist/*.test.js examples/cli/dist/acceptance/*.test.js examples/cli/dist/modules/*.test.js
      - run: node --import tsx --test --test-concurrency=4 src/shared/*.test.ts src/main/*.test.ts src/renderer/src/*.test.ts src/renderer/src/personal/*.test.ts
        working-directory: apps/desktop
      - run: node --test scripts/*.test.mjs
        working-directory: apps/desktop

  desktop-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.4.0
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:check
